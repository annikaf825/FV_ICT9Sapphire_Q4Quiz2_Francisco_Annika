<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Grade breakdown</title>
</head>
<body><center>
	<h1>Score Analyzer</h1>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<br>

<details>
            <summary>Instructions</summary>
            <p>Input your grades to get your score breakdown</p>
        </details>

<form onsubmit="return handleSubmit(event)">

<div class="image-row">
	<div class="subject-block">
	<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKGaqA6xPZttjSB-gX6HwSQXK5zF41bRXlaA&s" id="ENGLISH" alt="ENGLESH"></a>
	<br>
	<label>English:</label><br>
  <input type="text" id="ENGLISH" required>
	</div>
	<div class="subject-block">
	<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSeglELCcGuXl85qO57stP99s-JmkTTw16Uww&s" id="SCIENCE" alt="SCIENCE"></a>
	<br>
	<label>Science:</label><br>
  <input type="text" id="SCIENCE" required>
    </div>
    <div class="subject-block">
	<img src="https://lh3.googleusercontent.com/proxy/OM3kyUYvIUowRXjxJe9GdoW-BB4tJZ3gcuipV4zS4NBgtpv8XNqAt_LzBswkmvt47SL5su2DitWx8cs3MTJJIYNmrpJVs7XUWpaR9heljtHDMIFd5OJB5f6SC-z86IVFUgg" id="SS" alt="SS"></a>
	<br>
	<label>Social Studies:</label><br>
  <input type="text" id="SS" required>
	</div>
</div>

<br><br>
<button type="submit">Check Rating</button>
</form>
<style>
	  h1{
background-image: url("") ;
background-repeat: repeat;
color: #8ACCD5;
  margin: 0;
    padding: 10px;
    background-size: cover;
    border-radius: 10px;
}

body{
   background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2nr_9-QcrZvZOuNuAdZ5bWA83dmMWsovEOw&s");
      background-repeat: no repeat;
     background-size: cover;
     background-attachment: fixed;
}
    .image-row {
    	display: flex;
    	justify-content: center;
    	flex-wrap: wrap;
    	gap: 60px;
    	margin-top: 30px;
    }

    .subject-block {
    	text-align: center;
    }
img{
	width: 200px;
	height: 300px;
	margin-bottom: 10px;
}
   </style>

<script>

 function handleSubmit(event) {
    event.preventDefault();

    var sci = document.getElementById("SCIENCE").value;
    var eng = document.getElementById("ENGLISH").value;
    var ss = document.getElementById("SS").value;

    var avg = (sci * 1 + eng * 1 + ss * 1) / 3;
    var message = "";

    if (avg >= 94 && avg <= 100) {
      message = "Excellent";
    } else if (avg >= 87 && avg < 94) {
      message = "Above satisfactory";
    } else if (avg >= 80 && avg < 87) {
      message = "Satisfactory";
    } else if (avg >= 75 && avg < 80) {
      message = "Needs improvement";
    } else if (avg >= 70 && avg < 75) {
      message = "Poor";
    } else {
      message = "Low grade";
    }

    alert("Your average is " + avg.toFixed(2) + "" + message);

    return false;
  }
</script>

</body>
</html>
